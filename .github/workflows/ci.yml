name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the system libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 ffmpeg \
            fonts-noto-core fonts-indic

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check that nothing outside the platform layer touches the OS
        shell: bash
        run: |
          # Every OS-specific call must live in platform_compat.py (plus the
          # input watcher, which is the one deliberate exception).
          if grep -rnE "winreg|ctypes\.windll|os\.startfile|powershell" opal_studio/ \
             --include="*.py" \
             | grep -v "platform_compat.py" \
             | grep -v "input_watch.py"; then
            echo "::error::OS-specific calls found outside the platform layer"
            exit 1
          fi

      - name: Run the test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Run the exhaustive feature audit
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_every_feature.py

  build:
    name: Portable build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Build the core build
        run: python build_release.py --core

      - name: Build the full build
        run: python build_release.py

      - name: Check the build size
        shell: bash
        run: |
          # macOS ships an .app bundle, the other platforms a folder.
          if [ "$RUNNER_OS" = "macOS" ]; then
            full_dir="dist/Opal-Full.app"
          else
            full_dir="dist/Opal-Full"
          fi
          du -sm dist/Opal "$full_dir"
          # The core build must stay under 250 MB and the full build under
          # 650 MB. These limits stop a stray dependency from bloating it.
          core=$(du -sm dist/Opal | cut -f1)
          full=$(du -sm "$full_dir" | cut -f1)
          if [ "$core" -gt 250 ]; then
            echo "::error::Core build is ${core} MB, over the 250 MB budget"
            exit 1
          fi
          if [ "$full" -gt 650 ]; then
            echo "::error::Full build is ${full} MB, over the 650 MB budget"
            exit 1
          fi

      - name: Check that the release archive was produced
        shell: bash
        run: |
          ls -la dist/*.zip
          case "$RUNNER_OS" in
            macOS) tag=macOS-x64 ;;
            Linux) tag=Linux-x64 ;;
            *)     tag=Windows-x64 ;;
          esac
          version=$(python -c "from opal_studio.version import __version__; print(__version__)")
          # The website's download button points at these two files.
          test -f "dist/Opal-v${version}-${tag}.zip"
          test -f "dist/Opal-Full-v${version}-${tag}.zip"

      - name: Upload the builds
        uses: actions/upload-artifact@v4
        with:
          name: opal-${{ matrix.os }}
          path: |
            dist/Opal
            dist/Opal-Full
            dist/*.app
            dist/*.zip
          retention-days: 14
