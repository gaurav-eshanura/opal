<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Opal">
  <title>Opal</title>
  <defs>
    <radialGradient id="opal-body" cx="34%" cy="26%" r="88%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F2F5FC"/>
      <stop offset="1" stop-color="#C6D2E8"/>
    </radialGradient>

    <linearGradient id="opal-fire-cool" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#21C7D0"/>
      <stop offset="0.48" stop-color="#3C7BF2"/>
      <stop offset="1" stop-color="#8A5CF6"/>
    </linearGradient>

    <linearGradient id="opal-fire-warm" x1="0" y1="0.6" x2="1" y2="0.4">
      <stop offset="0" stop-color="#EE4E8A"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>

    <linearGradient id="opal-fire-green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#37C98A"/>
      <stop offset="1" stop-color="#21C7D0"/>
    </linearGradient>

    <linearGradient id="opal-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.74" stop-color="#96AAD7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5A6B93" stop-opacity="0.62"/>
    </linearGradient>

    <filter id="opal-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="opal-blur-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="opal-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="opal-clip">
      <ellipse cx="64" cy="64" rx="53" ry="43"/>
    </clipPath>
  </defs>

  <!-- The light the stone throws onto the surface it rests on. -->
  <ellipse cx="64" cy="66" rx="52" ry="42" fill="#8FB6F0" opacity="0.16" filter="url(#opal-glow)"/>

  <g clip-path="url(#opal-clip)">
    <ellipse cx="64" cy="64" rx="53" ry="43" fill="url(#opal-body)"/>

    <!-- The play of colour. The bands drift, the way an opal does when the
         light moves across it. -->
    <g filter="url(#opal-blur)">
      <g class="opal-band band-cool">
        <ellipse cx="50" cy="64" rx="50" ry="15" fill="url(#opal-fire-cool)" opacity="0.78"
                 transform="rotate(-19 50 64)"/>
      </g>
      <g class="opal-band band-warm">
        <ellipse cx="80" cy="76" rx="30" ry="11" fill="url(#opal-fire-warm)" opacity="0.62"
                 transform="rotate(-19 80 76)"/>
      </g>
      <g class="opal-band band-green">
        <ellipse cx="46" cy="76" rx="28" ry="9" fill="url(#opal-fire-green)" opacity="0.5"
                 transform="rotate(-19 46 76)"/>
      </g>
    </g>

    <!-- Depth on the far side of the stone. -->
    <ellipse cx="86" cy="86" rx="42" ry="30" fill="#38445F" opacity="0.16" filter="url(#opal-blur)"/>

    <!-- The wet highlight. -->
    <ellipse cx="41" cy="37" rx="17" ry="8" fill="#FFFFFF" opacity="0.72"
             transform="rotate(-31 41 37)" filter="url(#opal-blur-soft)"/>
    <ellipse cx="34" cy="31" rx="4.6" ry="3.1" fill="#FFFFFF" opacity="0.95"
             transform="rotate(-31 34 31)"/>
  </g>

  <!-- The refractive edge. -->
  <ellipse cx="64" cy="64" rx="53" ry="43" fill="none" stroke="url(#opal-rim)" stroke-width="2.1"/>
  <path d="M 17 55 A 53 43 0 0 1 55 23" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="2.1" stroke-linecap="round"/>

  <style>
    @keyframes opal-drift {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(5px, -3px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes opal-drift-2 {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(-6px, 3px); }
      100% { transform: translate(0, 0); }
    }
    .band-cool  { animation: opal-drift 11s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .band-warm  { animation: opal-drift-2 14s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .band-green { animation: opal-drift 17s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) {
      .band-cool, .band-warm, .band-green { animation: none; }
    }
  </style>
</svg>
